# Example nginx for resumebuilder.fun (SPA + Vite hashed assets).
# Merge into your real server { } (keep your ssl_certificate lines).
#
# Problems this fixes:
# • Stale index.html cached after deploy → old <script src="/assets/index-OLDHASH.js"> 404s → blank page.
# • Missing `location = /index.html` → SPA fallback may not get no-cache headers on some setups.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name resumebuilder.fun www.resumebuilder.fun;

    root /var/www/resumebuilder.fun;
    index index.html;

    # Hashed bundles — safe to cache forever.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML shell — always revalidate (covers internal redirect from try_files).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
